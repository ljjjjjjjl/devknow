<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devknow · Agent 流式输出演示</title>
  <link rel="stylesheet" href="agent-demo.css">
</head>
<body>
  <div class="page">

    <header class="head">
      <h1>devknow <span class="dim">/ Agent 流式输出</span></h1>
      <p class="sub"><code>POST /api/agent/chat/stream</code> · SSE 7 类事件 · 支持多轮</p>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">就绪</span>
      </div>
    </header>

    <main class="layout">

      <section class="panel chat">
        <!-- wrap 只用来给"跳到最新"按钮定位，滚动发生在里面的 .messages -->
        <div class="messages-wrap">
          <div class="messages" id="messages">
            <div class="empty" id="empty">
              <p>试一个能明显看到多步执行的提问：</p>
              <div class="samples">
                <button class="sample" type="button">如何配置多个数据源</button>
                <button class="sample" type="button">@WebMvcTest 应该怎么用</button>
                <button class="sample" type="button">Logback 升级要注意什么</button>
              </div>
            </div>
          </div>
          <button class="jump" type="button" id="jump" hidden>↓ 跳到最新</button>
        </div>

        <form class="composer" id="composer">
          <div class="composer-row">
            <label class="field">
              <span>agentConfigId</span>
              <input type="number" id="config-id" value="1" min="1" step="1">
            </label>
            <div class="composer-tools">
              <span class="conv" id="conv" title="当前会话 id，由 start 事件返回">尚未开始</span>
              <button class="ghost" type="button" id="reset">新会话</button>
              <button class="ghost" type="button" id="stop" disabled>停止</button>
            </div>
          </div>
          <textarea id="query" rows="2" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="composer-actions">
            <span class="hint" id="hint"></span>
            <button class="primary" type="submit" id="send">发送</button>
          </div>
        </form>
      </section>

      <!-- 右栏上半是"依据"（引用来源），下半是"过程"（原始事件流）。
           引用放在这里而不是回答下面：挂在回答下面会把正文一路往上挤，
           而引用本身很短，占满一行是浪费。 -->
      <aside class="panel side">

        <section class="side-block cites-block">
          <div class="side-head">
            <h2>引用来源</h2>
            <span class="count" id="cite-count">0</span>
          </div>
          <div class="cites" id="cites"></div>
        </section>

        <section class="side-block log-block">
          <div class="side-head">
            <h2>原始事件流</h2>
            <span class="count" id="log-count">0</span>
            <button class="ghost small" type="button" id="clear-log">清空</button>
          </div>
          <div class="legend">
            <span class="chip start">start</span>
            <span class="chip step">step</span>
            <span class="chip delta">delta</span>
            <span class="chip tool">tool</span>
            <span class="chip citation">citation</span>
            <span class="chip done">done</span>
            <span class="chip error">error</span>
          </div>
          <pre class="log" id="log"></pre>
        </section>

      </aside>

    </main>
  </div>

  <script src="agent-demo.js"></script>
</body>
</html>
