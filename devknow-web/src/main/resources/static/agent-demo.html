<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devknow · Agent 流式输出演示</title>
  <link rel="stylesheet" href="agent-demo.css">
</head>
<body>
  <div class="page">

    <header class="head">
      <h1><span class="brand">devknow</span> <span class="dim">/ Agent 流式输出</span></h1>
      <p class="sub"><code>POST /api/agent/chat/stream</code> · SSE 7 类事件 · 支持多轮</p>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">就绪</span>
      </div>
    </header>

    <main class="layout">

      <!-- 左栏：会话列表。数据全部来自 GET /api/agent/conversations，
           浏览器不缓存消息正文 —— 点开哪个会话就现拉哪个。
           服务端是唯一事实来源，于是不存在"本地缓存比库新"这类不一致。 -->
      <aside class="panel convs-panel">
        <div class="side-head">
          <h2>会话</h2>
          <span class="count" id="conv-count">0</span>
          <button class="ghost small" type="button" id="conv-refresh">刷新</button>
        </div>
        <div class="convs" id="convs"></div>
        <!-- 分页按钮钉在列表下方而不是跟着列表滚：会话一多，它跟在最后面
             等于要用户先滚到底才看得见 -->
        <div class="convs-foot" id="convs-foot" hidden>
          <button class="ghost small conv-more" type="button" id="conv-more"></button>
        </div>
      </aside>

      <section class="panel chat">
        <!-- wrap 只用来给"跳到最新"按钮定位，滚动发生在里面的 .messages -->
        <div class="messages-wrap">
          <div class="messages" id="messages">
            <div class="empty" id="empty">
              <p class="empty-title">挑一个问题试试，能看到多步检索与流式输出</p>
              <!-- 由 agent-demo.js 从问题池里随机填。池子是按 top-1 精排分筛过的，
                   问到库里没有的会直接触发拒答，所以不能随手写 -->
              <div class="samples" id="samples"></div>
              <p class="empty-note">问完可以接着追问（比如「那 Redis 呢」），上下文会延续 · 刷新换一批</p>
            </div>
          </div>
          <button class="jump" type="button" id="jump" hidden>↓ 跳到最新</button>
        </div>

        <form class="composer" id="composer">
          <div class="composer-row">
            <label class="field">
              <span>agentConfigId</span>
              <input type="number" id="config-id" value="1" min="1" step="1">
            </label>
            <div class="composer-tools">
              <span class="conv" id="conv" title="当前会话 id，由 start 事件返回">尚未开始</span>
              <button class="ghost" type="button" id="reset">新会话</button>
              <button class="ghost" type="button" id="stop" disabled>停止</button>
            </div>
          </div>
          <textarea id="query" rows="2" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="composer-actions">
            <span class="hint" id="hint"></span>
            <button class="primary" type="submit" id="send">发送</button>
          </div>
        </form>
      </section>

      <!-- 右栏上半是"依据"（引用来源），下半是"过程"（原始事件流）。
           引用放在这里而不是回答下面：挂在回答下面会把正文一路往上挤，
           而引用本身很短，占满一行是浪费。 -->
      <aside class="panel side">

        <section class="side-block cites-block">
          <div class="side-head">
            <h2>引用来源</h2>
            <span class="count" id="cite-count">0</span>
          </div>
          <div class="cites" id="cites"></div>
        </section>

        <section class="side-block log-block">
          <div class="side-head">
            <h2>原始事件流</h2>
            <span class="count" id="log-count">0</span>
            <button class="ghost small" type="button" id="clear-log">清空</button>
          </div>
          <div class="legend">
            <span class="chip start">start</span>
            <span class="chip step">step</span>
            <span class="chip delta">delta</span>
            <span class="chip tool">tool</span>
            <span class="chip citation">citation</span>
            <span class="chip done">done</span>
            <span class="chip error">error</span>
          </div>
          <pre class="log" id="log"></pre>
        </section>

      </aside>

    </main>
  </div>

  <script src="agent-demo.js"></script>
</body>
</html>
